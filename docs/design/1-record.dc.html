<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GrooveForge · Record</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060B}
a{color:#00E5FF}a:hover{color:#7FF3FF}
@keyframes gfBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes gfSpin{to{transform:rotate(360deg)}}
@keyframes gfRing{0%{transform:scale(1.9);opacity:0}30%{opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes gfBar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes gfSpark{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-90px) scale(.3);opacity:0}}
@keyframes gfPulse{0%{box-shadow:0 0 0 0 rgba(255,43,214,.55)}100%{box-shadow:0 0 0 26px rgba(255,43,214,0)}}
.gf-orb{animation:gfBreathe 2.4s ease-in-out infinite}
.gf-orb-rec{animation:gfBreathe .62s ease-in-out infinite}
.gf-conic{animation:gfSpin 9s linear infinite}
.gf-ring{animation:gfRing 2.5s cubic-bezier(.2,.7,.2,1) infinite}
.gf-bar{animation:gfBar 1.1s ease-in-out infinite;transform-origin:center}
.gf-spark{animation:gfSpark 1.6s ease-out infinite}
.gf-rec{animation:gfPulse 1.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.gf-orb,.gf-orb-rec,.gf-conic,.gf-ring,.gf-bar,.gf-spark,.gf-rec{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07060B; color: #F4F1FF; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 20px 28px">
  <div aria-hidden="true" style="position: absolute; left: -120px; top: 180px; width: 630px; height: 630px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,255,.22), rgba(7,6,11,0) 62%)"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em">GROOVE<span style="color: #FF2BD6; text-shadow: 0 0 14px rgba(255,43,214,.7)">FORGE</span></div>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #CFC8E8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
    </button>
  </div>

  <div style="position: relative; display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap">
    <span style="padding: 8px 14px; border-radius: 999px; background: rgba(255,43,214,.12); border: 1px solid rgba(255,43,214,.5); font-size: 13px; font-weight: 600; color: #FFB8F1">Funk</span>
    <span style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); font-size: 13px; font-family: 'JetBrains Mono', monospace; color: #CFC8E8">Click 96 BPM</span>
    <span style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); font-size: 13px; color: #CFC8E8">Kit taught ✓</span>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center">
    <div class="gf-ring" aria-hidden="true" style="position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 2px solid rgba(0,229,255,.7)"></div>
    <div class="gf-ring" aria-hidden="true" style="position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 2px solid rgba(255,43,214,.7); animation-delay: 1.25s"></div>
    <div class="{{orbClass}}" aria-hidden="true" style="position: relative; width: 210px; height: 210px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 60px rgba(255,43,214,.45), 0 0 120px rgba(0,229,255,.25)">
      <div class="gf-conic" style="position: absolute; inset: -30%; background: conic-gradient(from 0deg, #FF2BD6, #8B5CFF, #00E5FF, #C6FF3D, #FF2BD6); filter: blur(22px)"></div>
      <div style="position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), rgba(7,6,11,.85) 70%)"></div>
    </div>
    <div style="position: absolute; text-align: center">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 500; text-shadow: 0 0 18px rgba(255,255,255,.6)">{{timer}}</div>
      <div style="font-size: 12px; letter-spacing: .18em; color: #E9E3FF; margin-top: 4px">{{orbLabel}}</div>
    </div>
    <sc-if value="{{recording}}" hint-placeholder-val="{{ false }}">
      <div class="gf-spark" aria-hidden="true" style="position: absolute; left: 70px; top: 150px; width: 10px; height: 10px; border-radius: 50%; background: #FF2BD6; box-shadow: 0 0 14px #FF2BD6"></div>
      <div class="gf-spark" aria-hidden="true" style="position: absolute; right: 64px; top: 170px; width: 8px; height: 8px; transform: rotate(45deg); background: #00E5FF; box-shadow: 0 0 14px #00E5FF; animation-delay: .4s"></div>
      <div class="gf-spark" aria-hidden="true" style="position: absolute; left: 112px; bottom: 120px; width: 8px; height: 8px; background: #C6FF3D; box-shadow: 0 0 14px #C6FF3D; animation-delay: .8s"></div>
      <div class="gf-spark" aria-hidden="true" style="position: absolute; right: 100px; bottom: 140px; width: 9px; height: 9px; border-radius: 50%; background: #FF2BD6; box-shadow: 0 0 14px #FF2BD6; animation-delay: 1.2s"></div>
    </sc-if>
  </div>

  <div style="position: relative; height: 72px; display: flex; align-items: center; gap: 3px; padding: 0 4px" aria-hidden="true">
    <sc-for list="{{bars}}" as="bar" hint-placeholder-count="44">
      <div class="gf-bar" style="flex: 1; height: {{bar.h}}px; border-radius: 3px; background: {{bar.c}}; box-shadow: {{bar.glow}}; animation-delay: {{bar.d}}s"></div>
    </sc-for>
  </div>
  <div style="position: relative; display: flex; justify-content: space-between; font-size: 11px; color: #A69DC4; margin-top: 6px; font-family: 'JetBrains Mono', monospace">
    <span>● kick 9</span><span>▲ snare 6</span><span>■ hat 14</span><span>◆ perc 2</span>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 26px">
    <button type="button" aria-label="Upload audio" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #CFC8E8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>
    </button>
    <button type="button" class="{{recClass}}" onClick="{{toggle}}" aria-label="{{recAria}}" style="width: 96px; height: 96px; border-radius: 48px; border: 2px solid #FF2BD6; background: rgba(255,43,214,.16); display: flex; align-items: center; justify-content: center">
      <span style="width: {{dotSize}}px; height: {{dotSize}}px; border-radius: {{dotRadius}}px; background: #FF2BD6; box-shadow: 0 0 24px #FF2BD6"></span>
    </button>
    <button type="button" aria-label="Teach me your kit" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #CFC8E8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </div>
  <div style="position: relative; text-align: center; font-size: 13px; color: #A69DC4; margin-top: 12px">{{hint}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { recording: true }; }
  renderVals() {
    const rec = this.state.recording;
    const lanes = { k: '#FF2BD6', s: '#00E5FF', h: '#C6FF3D', p: '#8B5CFF' };
    const pattern = 'k..h.s.hk.h..sh.k.kh.s.hk..h.s.h.k.h.sk.h.ph';
    const bars = pattern.split('').map((ch, i) => {
      const base = 10 + Math.round(Math.abs(Math.sin(i * 1.7)) * 14);
      const hit = lanes[ch];
      return {
        h: hit ? (ch === 'k' ? 64 : ch === 's' ? 54 : 40) : base,
        c: hit || 'rgba(255,255,255,.16)',
        glow: hit ? '0 0 12px ' + hit : 'none',
        d: ((i % 7) * 0.12).toFixed(2)
      };
    });
    return {
      recording: rec,
      bars,
      timer: rec ? '00:07' : '00:00',
      orbLabel: rec ? 'BAR 2 OF 4' : 'READY',
      orbClass: rec ? 'gf-orb-rec' : 'gf-orb',
      recClass: rec ? 'gf-rec' : '',
      recAria: rec ? 'Stop recording' : 'Start recording',
      dotSize: rec ? 30 : 44,
      dotRadius: rec ? 8 : 22,
      hint: rec ? 'Listening… every hit lights up in its lane colour' : 'Tap to record, or hum after the beat for a bassline',
      toggle: () => this.setState({ recording: !rec })
    };
  }
}
</script>
</body>
</html>
